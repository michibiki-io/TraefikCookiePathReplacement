displayName: Cookie Path Replacement
type: middleware
import: github.com/michibiki-io/TraefikCookiePathReplacement
summary: "Rewrite cookie paths using regular expressions and named captures."

testData:
  replacements:
    - name_regex: "test(.*)"
      original: "(?P<before>.*)/old/(?P<after>.*)"
      replacement: "{{before}}/new/{{after}}"
